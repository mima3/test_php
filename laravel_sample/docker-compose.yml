services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: laravel_todo_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: todo_app
      DB_USERNAME: todo_user
      DB_PASSWORD: todo_pass
      FCGI_CAPTURE_AUTO: "true"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./:/var/www/html
      - ./capture:/capture

  nginx:
    image: nginx:1.27-alpine
    container_name: laravel_todo_nginx
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:16
    container_name: laravel_todo_db
    environment:
      POSTGRES_DB: todo_app
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
